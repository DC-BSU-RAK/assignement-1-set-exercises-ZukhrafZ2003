<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nature Landscapes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      padding: 20px;
      text-align: center;
    }
    .image-container {
      margin-bottom: 40px;
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      filter: contrast(1.1) brightness(0.95) saturate(1.2);
    }
    .license {
      font-size: 0.9em;
      color: #555;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Nature Landscapes</h1>

  <div class="image-container">
    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=75"
         alt="Mountain landscape during golden hour"
         width="800"
         height="533"
         title="Golden hour in the mountains">
    <div class="license">
      Photo by <a href="https://unsplash.com/@alexanderandrews" target="_blank">Alexander Andrews</a> on Unsplash – Free to use under Unsplash License.
    </div>
  </div>

  <div class="image-container">
    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=75"
         alt="Waves crashing on a sandy beach"
         width="800"
         height="533"
         title="Beach waves at sunset">
    <div class="license">
      Photo by <a href="https://unsplash.com/@seefromthesky" target="_blank">Sebastien Gabriel</a> on Unsplash – Free to use under Unsplash License.
    </div>
  </div>

  <div class="image-container">
    <img src="https://images.unsplash.com/photo-1493244040629-496f6d136cc3?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=75"
         alt="Forest with tall trees and sunlight"
         width="800"
         height="533"
         title="Sunlight through the forest">
    <div class="license">
      Photo by <a href="https://unsplash.com/@anniespratt" target="_blank">Annie Spratt</a> on Unsplash – Free to use under Unsplash License.
    </div>
  </div>

</body>
</html>
