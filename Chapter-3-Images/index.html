<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nature Landscapes Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      text-align: center;
      padding: 20px;
    }
    .image-container {
      margin: 20px auto;
      width: fit-content;
    }
    img {
      filter: grayscale(40%) brightness(1.1) contrast(1.2);
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      margin-bottom: 10px;
    }
    .caption {
      font-size: 0.9em;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>Nature Landscapes Gallery</h1>

  <div class="image-container">
    <img src="https://images.unsplash.com/photo-1480497490787-505ec076689f?q=80&w=1738&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Snow-covered mountain peak" width="400" height="267" title="Snowy Mountain Landscape">
    <div class="caption">Image by John Doe on Unsplash. Free for commercial use. No attribution required.</div>
  </div>

  <div class="image-container">
    <img src="https://images.unsplash.com/photo-1629977681963-f355b00b2d85?q=80&w=1887&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Sunlight streaming through forest trees" width="400" height="267" title="Sunlit Forest Path">
    <div class="caption">Image by Jane Smith on Unsplash. Free for commercial use. No attribution required.</div>
  </div>

  <div class="image-container">
    <img src="https://images.unsplash.com/photo-1468413253725-0d5181091126?q=80&w=1740&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Calm beach with waves and sunset" width="400" height="267" title="Peaceful Beach Sunset">
    <div class="caption">Image by Alex Johnson on Unsplash. Free for commercial use. No attribution required.</div>
  </div>

</body>
</html>
